spring.application.name=foodelivery

# Import .env file (Make sure you have the dotenv library or Spring 3+ setup)
spring.config.import=optional:file:.env

# Database Connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate (Removed hardcoded Dialect)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# SQL Initialization Logic
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.jpa.defer-datasource-initialization=${JPA_DEFER_DATASOURCE_INITIALIZATION:false}

# Security Settings
jwt.secretKey=${JWT_SECRET_KEY}
stripe.api.key = ${STRIPE_API_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# Swagger / OpenAPI
# Swagger / OpenAPI basic setup
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Isse Swagger UI apne aap definition file ko dhund lega
springdoc.swagger-ui.display-query-params-copy-to-clipboard=true