spring.application.name=foodelivery
# 1. Database Connection (Ahmedabad local setup ke liye typical settings)
# 1. Database Connection
# Check kijiye ki port 3306 hi hai na? Aur database name sahi hai?
spring.datasource.url=jdbc:mysql://localhost:3306/fooddelivery
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Dialect - Yeh Hibernate ko MySQL ki bhasha sikhayega
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# 3. Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 4. Data Initialization (Jo humne pehle discuss kiya tha)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
